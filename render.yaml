# render.yaml — Render Blueprint: BEPUL Web Service ni avtomatik sozlaydi
# Ishlatish: Render da + New -> Blueprint -> telegram-bot reponi tanlash.
# BOT_TOKEN va ADMIN_IDS ni Render dashboard (Environment) ga qo'lda qo'shing.
# Keyin https://uptimerobot.com da bepul monitor qo'shib, servis URL ni
# har 5 daqiqada chaqirtiring (servis uxlab qolmasligi uchun).
services:
  - type: web
    name: telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "7202086547"
